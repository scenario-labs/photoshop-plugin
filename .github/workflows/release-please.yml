# Release automation, as in blender-plugin. On each push to main,
# release-please keeps the release PR up to date: the next version in
# plugin/manifest.json and the helper, and the changelog from the Conventional
# Commit titles. Merging that PR authorizes the release: release-please creates
# a draft release, the jobs below build the .ccx and the handbook from the
# release commit, check them, attach them with checksums and a build
# attestation, then publish the draft, which creates the photoshop-plugin-vX.Y.Z
# tag. The Publish site workflow (pages.yml) runs after this one by its name,
# and publish-changelog.yml on the published release.
# RELEASING.md has the steps, the settings it needs and the recovery.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Forks have neither the App credentials nor anything to release.
    if: github.repository == 'scenario-labs/photoshop-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.pending.outputs.found == 'true' || steps.release-please.outputs.release_created == 'true' }}
      tag_name: ${{ steps.pending.outputs.tag_name || steps.release-please.outputs.tag_name }}
      sha: ${{ steps.pending.outputs.sha || steps.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The release PR, release commit, tag and release are created with a
      # GitHub App token, not GITHUB_TOKEN: GitHub never starts a workflow from
      # an event created by GITHUB_TOKEN, and the release PR must run the same
      # CI as any other PR while this run's completion starts Publish site.
      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - name: Find an unfinished draft before creating another release
        id: pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/find-draft.js

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.pending.outputs.found != 'true'
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: true

  # The release is created as a draft, so its tag does not exist yet: the
  # package is built from the release commit, checked, checksummed, attested
  # and attached to the draft, and only the publish job below flips it, which
  # is what creates the tag.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Manifest version must equal the tag
        run: |
          set -euo pipefail
          # The provenance action records the triggering SHA from signed OIDC
          # claims. Recover by rerunning the original release workflow only.
          [ "$RELEASE_SHA" = "$GITHUB_SHA" ] || { echo "::error::Re-run the original release workflow so provenance matches the release commit"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::Checkout does not match the release commit"; exit 1; }
          V="$(node -p 'require("./plugin/manifest.json").version')"
          [ "photoshop-plugin-v$V" = "$TAG" ] || { echo "::error::manifest version $V does not match $TAG"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # The package and the handbook use Node's built-in modules only, so no
      # npm install runs here. The handbook links its files at the release tag.
      - name: Build the package and the standalone handbook, check the package, then checksum
        env:
          HANDBOOK_GITHUB_REF: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node plugin/scripts/package.js
          cp "build/scenario-photoshop-${VERSION}.ccx" dist/
          node tools/release/check-package.js "dist/scenario-photoshop-${VERSION}.ccx" "$VERSION"
          node tools/handbook/build.js --no-pdf --quiet --out "$RUNNER_TEMP/handbook"
          cp "$RUNNER_TEMP/handbook/scenario-photoshop-handbook-${VERSION}.html" dist/
          (cd dist && sha256sum "scenario-photoshop-${VERSION}.ccx" "scenario-photoshop-handbook-${VERSION}.html" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/scenario-photoshop-${{ env.VERSION }}.ccx
            dist/scenario-photoshop-handbook-${{ env.VERSION }}.html
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ccx
          path: dist/scenario-photoshop-${{ env.VERSION }}.ccx
          if-no-files-found: error
          overwrite: true

      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      # The attestation's Sigstore bundle lets anyone verify the three files
      # without GitHub's attestation API; OpenSSF Scorecard counts it as a signature.
      - name: Attach the package, handbook, SHA256SUMS and provenance bundle to the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          RELEASE="$(gh release view "$TAG" --json isDraft,targetCommitish)"
          jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha' <<<"$RELEASE" > /dev/null
          cp "$BUNDLE" "dist/scenario-photoshop-${VERSION}.sigstore.json"
          gh release upload "$TAG" "dist/scenario-photoshop-${VERSION}.ccx" "dist/scenario-photoshop-handbook-${VERSION}.html" dist/SHA256SUMS "dist/scenario-photoshop-${VERSION}.sigstore.json" --clobber

      # release-please notes name no authors; GitHub's generated notes do. A
      # missing thank-you must not hold back a checked release.
      - name: Thank the release's contributors in the draft notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/contributors.js

  # No runner has Photoshop. The package built above is checked again on
  # macOS, where the plugin is tested: a release build of the same commit must
  # give the same bytes there.
  validate:
    name: validate (macOS)
    needs: [release-please, assets]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ccx
          path: dist

      - run: node tools/release/check-package.js "dist/scenario-photoshop-${TAG#photoshop-plugin-v}.ccx" "${TAG#photoshop-plugin-v}"

  # Publishing the draft creates the tag, makes the release public and fires
  # `release: published`, which publish-changelog.yml consumes. Nothing may be
  # attached after this once immutable releases are on.
  publish:
    needs: [release-please, assets, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - name: Publish the draft (creates the tag)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          V="${TAG#photoshop-plugin-v}"
          RELEASE="$(gh release view "$TAG" --json isDraft,targetCommitish,assets)"
          jq -e --arg sha "$RELEASE_SHA" --arg ccx "scenario-photoshop-$V.ccx" --arg handbook "scenario-photoshop-handbook-$V.html" --arg bundle "scenario-photoshop-$V.sigstore.json" '
            .isDraft and .targetCommitish == $sha and
            any(.assets[]; .name == "SHA256SUMS") and
            any(.assets[]; .name == $ccx) and
            any(.assets[]; .name == $handbook) and
            any(.assets[]; .name == $bundle)
          ' <<<"$RELEASE" > /dev/null
          gh release edit "$TAG" --draft=false

  # Untagged drafts are invisible to release-please's commit-boundary discovery.
  # Generate the next PR only after publication, or when there was no draft.
  release-pr:
    needs: [release-please, publish]
    if: >-
      ${{ !cancelled() && needs.release-please.result == 'success' &&
          (needs.publish.result == 'success' ||
           (needs.publish.result == 'skipped' && needs.release-please.outputs.release_created != 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: true
