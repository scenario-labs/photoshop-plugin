name: pr-name-linter

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # PRs are squash-merged, so the PR title becomes the commit header on main.
  # The main ruleset should require this check by its context, which is the
  # job id: do not rename it.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install commitlint from its lockfile
        run: npm ci --prefix tools/commitlint --ignore-scripts --no-audit --no-fund
      # The title is attacker-controlled text on fork PRs: it goes through an
      # environment variable and is never interpolated into the script.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" \
            | tools/commitlint/node_modules/.bin/commitlint --config tools/commitlint/commitlint.config.mjs --verbose
