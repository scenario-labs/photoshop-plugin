# Public supply-chain posture report for the README badge; never a required
# check. Keep the upstream publication restrictions: no workflow or job env or
# defaults, read-only workflow permissions, and only approved actions in the
# publishing job. The results go to the public Scorecard viewer and a run
# artifact, not to code scanning: test/unit/supply-chain.test.js allows a
# workflow no security-events: write.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    if: github.repository == 'scenario-labs/photoshop-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
