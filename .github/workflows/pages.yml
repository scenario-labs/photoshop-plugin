# GitHub Pages publish for https://photoshop.scenario.com: the page in site/.
# Runs by hand only, from main. Before the first run:
#   1. Repository Settings > Pages: Source "GitHub Actions"; Custom domain
#      photoshop.scenario.com; Enforce HTTPS once the certificate is issued.
#   2. DNS for scenario.com: CNAME photoshop -> scenario-labs.github.io.
#   3. Actions > Site > Run workflow (from main).
# The generated handbook keeps its own workflow in tools/handbook/pages.yml.
name: Site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: node test/run.js site-page
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
