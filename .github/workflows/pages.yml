# GitHub Pages publish for https://photoshop.scenario.com: the page in site/
# at the root and the handbook generated from the docs under /handbook/, as one
# site. Runs after each release, on every push to main that changes either, and
# by hand. As for blender.scenario.com, the page, the docs and the version come
# from the newest published release, so the site never names a version or
# describes a feature people cannot download yet; the builders stay on main.
# Pages serves it at https://scenario-labs.github.io/photoshop-plugin/; the
# Vercel project on tools/site_proxy holds photoshop.scenario.com and
# forwards every path there, as for blender.scenario.com. Set once:
#   1. Repository Settings > Pages: Source "GitHub Actions" and no custom
#      domain: one would make Pages redirect the proxy's requests back to it.
#   2. Vercel (scenario-labs): project photoshop-plugin-site, Root Directory
#      tools/site_proxy, framework Other, no build or install command,
#      production branch main, Ignored Build Step
#      `git diff --quiet HEAD^ HEAD -- .`, Web Analytics on, and the domain
#      photoshop.scenario.com. tools/site_proxy holds only vercel.json and
#      middleware.ts: Vercel would serve any other file there instead of
#      forwarding its path. The middleware counts downloads in PostHog with
#      POSTHOG_PROJECT_TOKEN (none: no count), POSTHOG_HOST (US cloud by
#      default) and SITE_ORIGIN (this Pages address by default) from the
#      project's environment.
#   3. DNS for scenario.com (Route 53): CNAME photoshop to the target Vercel
#      shows for that domain.
name: Publish site

on:
  # workflow_run is safe here: the build checks out main, never the
  # triggering run's head_sha, uses none of its artifacts, keeps no
  # credentials, and runs only after a successful push run on main.
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/handbook/**"
      - "README.md"
      - "docs/USER_GUIDE.md"
      - "docs/MCP.md"
      - "docs/KNOWN_LIMITATIONS.md"
      - "docs/media/**"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "tools/release/stamp-site.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only this repository publishes, and only after a release run that
    # succeeded on a push to main.
    if: >-
      github.repository == 'scenario-labs/photoshop-plugin' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      # The newest published release: its page and docs replace main's, and its
      # version and tag fill the page's {{version}} and {{ref}}
      # (tools/release/stamp-site.js). A release from before the page took its
      # version at publish time (0.8.0 and earlier) spells it out in its page,
      # so main's page and docs are published for it, with the release's
      # version. Before the first release, main's own.
      - name: Take the page and the docs from the newest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An empty answer means no release yet; an error from GitHub fails the
          # step rather than publishing the site without its download.
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isLatest --jq '[.[] | select(.isLatest)][0].tagName // ""')"
          if [ -z "$tag" ]; then
            echo "::notice::No release yet: main's page and docs, with no download"
            version="$(node -p 'require("./plugin/manifest.json").version')"
            { echo "tag="; echo "version=$version"; echo "ref=main"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#photoshop-plugin-v}"
          [[ "$tag" == "photoshop-plugin-v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected release tag $tag"; exit 1; }
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          git restore --overlay --source="$commit" -- plugin/manifest.json
          if git show "$commit:site/index.html" | grep -qF '{{version}}'; then
            git restore --overlay --source="$commit" -- site docs README.md PRIVACY.md SECURITY.md CHANGELOG.md
          else
            echo "::warning::$tag spells its version in its page: publishing main's page and docs with version $version"
          fi
          [ "$(node -p 'require("./plugin/manifest.json").version')" = "$version" ] || { echo "::error::$tag's manifest is not $version"; exit 1; }
          { echo "tag=$tag"; echo "version=$version"; echo "ref=$tag"; } >> "$GITHUB_OUTPUT"
      - run: node test/run.js site-page
      # pdftotext numbers the PDF's contents; Chrome prints the PDF.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Put the site and the handbook together
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # The handbook's links to the repository point to the release.
          HANDBOOK_GITHUB_REF: ${{ steps.release.outputs.ref }}
          VERSION: ${{ steps.release.outputs.version }}
          REF: ${{ steps.release.outputs.ref }}
        run: |
          set -euo pipefail
          cp -R site "$RUNNER_TEMP/site"
          node tools/release/stamp-site.js "$RUNNER_TEMP/site/index.html" "$VERSION" "$REF"
          # A PDF problem (Chrome, Poppler, page numbers) keeps the site and
          # the handbook web page; a problem in the docs themselves, which
          # npm test catches on every pull request, fails the retry too and
          # stops the publish. The first run's output names the cause.
          if ! npm run handbook -- --out "$RUNNER_TEMP/site/handbook"; then
            echo "::warning::The handbook build failed (cause above): retrying without the PDF"
            rm -rf "$RUNNER_TEMP/site/handbook"
            npm run handbook -- --no-pdf --out "$RUNNER_TEMP/site/handbook"
          fi
      # The latest release's package, served from the site's own domain at
      # download/scenario-photoshop-X.Y.Z.ccx, where the Vercel middleware
      # (tools/site_proxy/middleware.ts) counts downloads; download/latest.json
      # names its version and /download/latest redirects to it. Checked
      # against the release's SHA256SUMS and its build attestation first.
      # Before the first release there is nothing to add.
      - name: Add the latest release's package
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          file="scenario-photoshop-$version.ccx"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir" "$RUNNER_TEMP/site/download"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern SHA256SUMS --pattern "$file"
          grep -E "^[0-9a-f]{64}  $file\$" "$dir/SHA256SUMS" > "$RUNNER_TEMP/site/download/SHA256SUMS"
          (cd "$dir" && sha256sum -c "$RUNNER_TEMP/site/download/SHA256SUMS")
          # Built by this repository's release workflow from the tagged commit.
          gh attestation verify "$dir/$file" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-please.yml"
          cp "$dir/$file" "$RUNNER_TEMP/site/download/"
          printf '{ "version": "%s" }\n' "$version" > "$RUNNER_TEMP/site/download/latest.json"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
