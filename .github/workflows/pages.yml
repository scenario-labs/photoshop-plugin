# GitHub Pages publish for https://photoshop.scenario.com: the page in site/
# at the root and the handbook generated from the docs under /handbook/, as one
# site. Runs after each release, on every push to main that changes either, and
# by hand. Before the first run:
#   1. Repository Settings > Pages: Source "GitHub Actions"; Custom domain
#      photoshop.scenario.com; Enforce HTTPS once the certificate is issued.
#   2. DNS for scenario.com: CNAME photoshop -> scenario-labs.github.io.
name: Publish site

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/handbook/**"
      - "README.md"
      - "docs/USER_GUIDE.md"
      - "docs/MCP.md"
      - "docs/KNOWN_LIMITATIONS.md"
      - "docs/media/**"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only this repository publishes, and only after a release run that
    # succeeded on a push to main.
    if: >-
      github.repository == 'scenario-labs/photoshop-plugin' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: node test/run.js site-page
      # pdftotext numbers the PDF's contents; Chrome prints the PDF.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Put the site and the handbook together
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          cp -R site "$RUNNER_TEMP/site"
          npm run handbook -- --out "$RUNNER_TEMP/site/handbook"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
