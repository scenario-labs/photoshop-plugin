# Publishes the page in site/ to GitHub Pages, as blender-plugin does: Pages has
# build type "workflow" and no custom domain, so it serves
# https://scenario-labs.github.io/photoshop-plugin/. https://photoshop.scenario.com
# is a Vercel project in front of it, deployed from tools/site_proxy/ on main.
# Runs on every push to main that changes the page, and by hand.
# One-time setup:
#   1. Repository Settings > Pages: Source "GitHub Actions", no custom domain.
#   2. Vercel: a project from this repository with Root Directory tools/site_proxy,
#      framework preset Other, no build or install command, production branch
#      main, Ignored Build Step `git diff --quiet HEAD^ HEAD -- .`, and Web
#      Analytics on. Add the domain photoshop.scenario.com to it.
#   3. DNS for scenario.com (Route 53): CNAME photoshop -> the target Vercel
#      shows for that domain.
#   4. Run this workflow once, or push a change to site/.
# tools/site_proxy/ holds only vercel.json: Vercel would serve any other file
# there instead of forwarding its path.
# The generated handbook keeps its own workflow in tools/handbook/pages.yml.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "test/unit/site-page.test.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: node test/run.js site-page
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
