name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Meant as a required check in the main ruleset, with pr-title. It lints
  # every commit the PR adds on top of its base branch with the same
  # tools/commitlint/commitlint.config.mjs as the pr-title job in pr-name.yml.
  # Do not rename it.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install commitlint from its lockfile
        run: npm ci --prefix tools/commitlint --ignore-scripts --no-audit --no-fund
      # The base branch name goes through an environment variable, like the PR
      # title in pr-name.yml, so nothing from the event is interpolated into the script.
      - name: Lint the commit messages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          tools/commitlint/node_modules/.bin/commitlint --config tools/commitlint/commitlint.config.mjs \
            --from "origin/$BASE_REF" --to HEAD --verbose
