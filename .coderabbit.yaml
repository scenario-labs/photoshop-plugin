# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Scenario: CodeRabbit configuration for scenario-labs/photoshop-plugin
# Prepared by CodeRabbit, Thursday November 19th 2026, after the November 18th call.
#
# Commit this file as .coderabbit.yaml at the root of the default branch of photoshop-plugin. It starts with
# "inheritance: true", so everything in the organization baseline (the .coderabbit.yaml in the
# scenario-labs/coderabbit repository) applies here too: lists such as path instructions, checks
# and file filters are combined, and the single values set below win over the baseline. This file
# therefore holds only what is specific to photoshop-plugin: the Photoshop UXP plugin.
#
# Pull requests opened by organization members read this file from their own branch, so a branch
# cut before the commit picks it up once it is updated from the default branch; pull requests from
# outside collaborators read it from the target branch at once.
# Kept from your dashboard for this repository: assertive profile, review details.
# Verify with the comment "@coderabbitai configuration" on any open pull request.

inheritance: true

reviews:
  profile: assertive   # kept from your dashboard
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: >-
        Photoshop plugin. Beyond the editor plugin rules in the baseline: an invalid_client or
        similar identity provider error is a configuration failure, not a sign out, and must not
        delete stored sign ins; an abandoned browser sign in must not stay pending and be saved
        later under another project or account; install and release documentation must match the
        package files (a removed lock file changes the install command); the release changelog link
        check must pass on release pull requests. Findings on the sibling pull request a change
        depends on belong there, not here.
