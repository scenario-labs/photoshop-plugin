# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for photoshop-plugin. It adds to the organization's central CodeRabbit
# configuration: with inheritance on, lists are combined and a value set here wins over the
# central one. Keep here only what is specific to this repository.
#
# Which copy of this file a review reads: for a pull request from a trusted author (an
# organization member, or a collaborator with write access) the one on the pull request branch;
# otherwise, forks included, the one on the pull request's base commit. A branch created before
# a change picks it up once it includes that change.
#
# To see the settings in force and where each comes from, comment
# "@coderabbitai configuration" on any pull request.

inheritance: true

reviews:
  profile: assertive
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: >-
        Photoshop plugin. Beyond the editor plugin rules in the baseline: an invalid_client or
        similar identity provider error is a configuration failure, not a sign out, and must not
        delete stored sign ins; an abandoned browser sign in must not stay pending and be saved
        later under another project or account; install and release documentation must match the
        package files (a removed lock file changes the install command); the release changelog link
        check must pass on release pull requests. Findings on the sibling pull request a change
        depends on belong there, not here.
